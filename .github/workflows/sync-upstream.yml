name: Sync Upstream Changes

on:
  schedule:
    # Check daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/msitarzewski/agency-agents.git
          git fetch upstream

      - name: Check for changes
        id: check
        run: |
          # Compare our main with upstream main
          CHANGES=$(git log HEAD..upstream/main --oneline 2>/dev/null | head -20)
          if [ -z "$CHANGES" ]; then
            echo "No upstream changes"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream has new commits:"
            echo "$CHANGES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch and PR
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="sync-upstream-$(date +%Y%m%d)"
          git checkout -b $BRANCH
          git merge upstream/main --no-edit || true
          git push origin $BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync-upstream-${{ github.run_id }}
          title: "🔄 Upstream changes detected in agency-agents"
          body: |
            ## Upstream Changes Detected

            The original [msitarzewski/agency-agents](https://github.com/msitarzewski/agency-agents) repo has new commits:

            ```
            ${{ steps.check.outputs.changes }}
            ```

            ### Review Checklist
            - [ ] Review changed agent files for improvements we should adopt
            - [ ] Check for new agents we don't have yet
            - [ ] Check for removed/deprecated agents
            - [ ] Update our adapted versions if upstream changes are relevant
            - [ ] Update CHANGELOG.md with any adopted changes

            ### Important
            We **adapted** these agents for Textmimedia — don't blindly merge. Review each change and decide if it improves our version.
          labels: upstream-sync
